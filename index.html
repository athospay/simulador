                <div class="slide-container relative">

                        <i data-feather="chevron-right"></i>

            let taxRate = 0;
            if (annualRevenue <= 180000) taxRate = taxRates[annex]["180000"];
            else if (annualRevenue <= 360000) taxRate = taxRates[annex]["360000"];
            else if (annualRevenue <= 720000) taxRate = taxRates[annex]["720000"];

            else if (annualRevenue <= 3600000) taxRate = taxRates[annex]["3600000"];
            else taxRate = taxRates[annex]["4800000"];

            if (annualRevenue <= 180000) return "1";

<p class="slider-label">Percentual de lucro sobre o faturamento</p>
</div>
<div class="mb-3">
<label class="block text-blue-200 mb-1">Percentual de Repasse a Terceiros:</label>
<p class="text-xl font-bold mb-1" id="repasse-value">50,00%</p>
<input class="w-full" id="repasse-slider" max="90" min="0" step="1" type="range" value="50"/>
<div class="flex justify-between text-xs text-blue-200">

<span class="slider"></span>

<div class="col-span-7">
<div class="simulator-card p-4 h-full">
<h2 class="text-2xl font-semibold mb-3 text-green-300">Resultados da Simulação</h2>
<div class="grid grid-cols-2 gap-3 mb-3">
<div class="result-card p-3">
<p class="text-sm text-blue-200 mb-0.5">Carga Tributária Original:</p>
<p class="text-2xl font-bold text-white" id="carga-original">14,44%</p>
<p class="text-xs text-blue-200 mt-0.5">IRPJ + CSLL + PIS + COFINS</p>
</div>
<div class="result-card p-3">
<p class="text-sm text-blue-200 mb-0.5">Carga Tributária com Split:</p>
<p class="text-2xl font-bold text-green-400" id="carga-ajustada">6,72%</p>
<p class="text-xs text-green-300 mt-0.5">Redução em <span id="reducao-percentual">53,46%</span></p>
</div>
<div class="result-card p-3">
<p class="text-sm text-blue-200 mb-0.5">Economia Mensal:</p>
<p class="text-2xl font-bold text-green-400" id="economia-mensal">R$ 15.437,50</p>
<p class="text-xs text-green-300 mt-0.5">Valor preservado mensalmente</p>
</div>
<div class="result-card p-3">
<p class="text-sm text-blue-200 mb-0.5">Economia em 12 meses:</p>
<p class="text-2xl font-bold text-green-400" id="economia-anual">R$ 185.250,00</p>
<p class="text-xs text-green-300 mt-0.5">Impacto total anual no seu negócio</p>
</div>
</div>
<div class="mt-2">
<p class="text-base font-semibold mb-1 text-blue-200">Comparação de Cenários:</p>
<div class="chart-container">
<canvas height="250" id="tax-chart" width="822"></canvas>
</div>
</div>
<div class="mt-2 bg-gradient-to-r from-blue-900 to-blue-800 p-2 rounded-lg">
<p class="font-semibold flex items-center">
<i class="fas fa-chart-line text-green-300 mr-2"></i>
                            Ideal para empresas de maior volume: economize até <span class="text-green-300 text-xl ml-1" id="reducao-destaque">53,46%</span> da carga tributária!
                        </p>
</div>
</div>
</div>
</div>
</div>
<script>
        const taxConfig = { irpj: 0.15, irpj_adicional: 0.10, irpj_limite_adicional_mensal: 20000, csll: 0.09, pis: 0.0165, cofins: 0.076, creditos_piscofins: 0.25 };
        function formatCurrency(value) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value); }
        function formatPercentage(value) { return (value * 100).toFixed(2).replace('.', ',') + '%'; }
        let taxChart;
        function initChart() {
            const ctx = document.getElementById('tax-chart').getContext('2d');
            if (taxChart) taxChart.destroy();
            taxChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Sem Split', 'Com Split'],
                    datasets: [
                        { label: 'IRPJ', data: [7500, 3750], backgroundColor: 'rgba(255, 99, 132, 0.7)', borderColor: 'rgba(255, 99, 132, 1)', borderWidth: 1 },
                        { label: 'CSLL', data: [2250, 1125], backgroundColor: 'rgba(255, 159, 64, 0.7)', borderColor: 'rgba(255, 159, 64, 1)', borderWidth: 1 },
                        { label: 'PIS', data: [1237.5, 618.75], backgroundColor: 'rgba(75, 192, 192, 0.7)', borderColor: 'rgba(75, 192, 192, 1)', borderWidth: 1 },
                        { label: 'COFINS', data: [5700, 2850], backgroundColor: 'rgba(54, 162, 235, 0.7)', borderColor: 'rgba(54, 162, 235, 1)', borderWidth: 1 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: true, position: 'bottom', labels: { color: 'rgba(255, 255, 255, 0.8)', font: { size: 10 }, boxWidth: 12 } }, tooltip: { callbacks: { label: function(context) { let label = context.dataset.label || ''; if (label) { label += ': '; } label += formatCurrency(context.parsed.y); return label; } } } }, scales: { x: { stacked: true, grid: { display: false }, ticks: { color: 'rgba(255, 255, 255, 0.8)' } }, y: { stacked: true, beginAtZero: true, grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: 'rgba(255, 255, 255, 0.8)', callback: function(value) { return formatCurrency(value); } } } }, animation: { duration: 500 } }
            });
        }
        function calculateSimulation() {
            const faturamento = parseFloat(document.getElementById('faturamento-slider').value);
            const margemLucro = parseFloat(document.getElementById('margem-slider').value) / 100;
            const percentualRepasse = parseFloat(document.getElementById('repasse-slider').value) / 100;
            const creditosPiscofins = document.getElementById('creditos-toggle').checked;
            
            const lucro = faturamento * margemLucro;
            let irpjValue = lucro * taxConfig.irpj;
            if (lucro > taxConfig.irpj_limite_adicional_mensal) { irpjValue += (lucro - taxConfig.irpj_limite_adicional_mensal) * taxConfig.irpj_adicional; }
            const csllValue = lucro * taxConfig.csll;
            let pisValue, cofinsValue;
            if (creditosPiscofins) { pisValue = faturamento * taxConfig.pis * (1 - taxConfig.creditos_piscofins); cofinsValue = faturamento * taxConfig.cofins * (1 - taxConfig.creditos_piscofins); } else { pisValue = faturamento * taxConfig.pis; cofinsValue = faturamento * taxConfig.cofins; }
            const totalTaxes = irpjValue + csllValue + pisValue + cofinsValue;
            
            const faturamentoEfetivo = faturamento * (1 - percentualRepasse);
            const lucroEfetivo = faturamentoEfetivo * margemLucro;
            let irpjValueSplit = lucroEfetivo * taxConfig.irpj;
            if (lucroEfetivo > taxConfig.irpj_limite_adicional_mensal) { irpjValueSplit += (lucroEfetivo - taxConfig.irpj_limite_adicional_mensal) * taxConfig.irpj_adicional; }
            const csllValueSplit = lucroEfetivo * taxConfig.csll;
            let pisValueSplit, cofinsValueSplit;
            if (creditosPiscofins) { pisValueSplit = faturamentoEfetivo * taxConfig.pis * (1 - taxConfig.creditos_piscofins); cofinsValueSplit = faturamentoEfetivo * taxConfig.cofins * (1 - taxConfig.creditos_piscofins); } else { pisValueSplit = faturamentoEfetivo * taxConfig.pis; cofinsValueSplit = faturamentoEfetivo * taxConfig.cofins; }
            const totalTaxesSplit = irpjValueSplit + csllValueSplit + pisValueSplit + cofinsValueSplit;
            
            const economiaMensal = totalTaxes - totalTaxesSplit;
            const economiaAnual = economiaMensal * 12;
            const cargaOriginal = totalTaxes / faturamento;
            const cargaAjustada = totalTaxesSplit / faturamento;
            const reducaoPercentual = (totalTaxes - totalTaxesSplit) / totalTaxes;
            
            document.getElementById('carga-original').textContent = formatPercentage(cargaOriginal);
            document.getElementById('carga-ajustada').textContent = formatPercentage(cargaAjustada);
            document.getElementById('economia-mensal').textContent = formatCurrency(economiaMensal);
            document.getElementById('economia-anual').textContent = formatCurrency(economiaAnual);
            document.getElementById('reducao-percentual').textContent = formatPercentage(reducaoPercentual);
            document.getElementById('reducao-destaque').textContent = formatPercentage(reducaoPercentual);
            
            if (taxChart) {
                taxChart.data.datasets[0].data = [irpjValue, irpjValueSplit];
                taxChart.data.datasets[1].data = [csllValue, csllValueSplit];
                taxChart.data.datasets[2].data = [pisValue, pisValueSplit];
                taxChart.data.datasets[3].data = [cofinsValue, cofinsValueSplit];
                taxChart.update();
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            initChart();
            document.getElementById('faturamento-slider').value = 1000000;
            document.getElementById('faturamento-value').textContent = formatCurrency(1000000);
            document.getElementById('margem-slider').value = 10;
            document.getElementById('margem-value').textContent = "10,00%";
            document.getElementById('repasse-slider').value = 50;
            document.getElementById('repasse-value').textContent = "50,00%";
            document.getElementById('creditos-toggle').checked = true;
            
            document.getElementById('faturamento-slider').addEventListener('input', function() { document.getElementById('faturamento-value').textContent = formatCurrency(parseFloat(this.value)); calculateSimulation(); });
            document.getElementById('margem-slider').addEventListener('input', function() { document.getElementById('margem-value').textContent = (parseFloat(this.value)).toFixed(2).replace('.', ',') + '%'; calculateSimulation(); });
            document.getElementById('repasse-slider').addEventListener('input', function() { document.getElementById('repasse-value').textContent = (parseFloat(this.value)).toFixed(2).replace('.', ',') + '%'; calculateSimulation(); });
            document.getElementById('creditos-toggle').addEventListener('change', calculateSimulation);
            calculateSimulation();
        });
    <\/script>
</body>
</html>`;

                // --- STREAMING_CHUNK:Aplicando auto-scale aos iframes... ---
                // Função de limpeza e injeção do auto-scaling para garantir ajuste perfeito nos iframes
                const processSlide = (htmlContent) => {
                    const scaleScript = `
                    <style>body{background:#e5e7eb; overflow:hidden; margin:0;}</style>
                    <script>
                        function scaleSlide() {
                            const bg = document.querySelector('.slide-bg');
                            if(!bg) return;
                            const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
                            bg.style.transform = 'scale(' + scale + ')';
                            bg.style.transformOrigin = 'center center';
                            bg.style.position = 'absolute';
                            bg.style.left = '50%';
                            bg.style.top = '50%';
                            bg.style.marginLeft = '-640px';
                            bg.style.marginTop = '-360px';
                        }
                        window.addEventListener('resize', scaleSlide);
                        document.addEventListener('DOMContentLoaded', scaleSlide);
                    <\/script>
                    `;
                    return htmlContent.replace('</body>', scaleScript + '</body>');
                };

                onMounted(() => {
                    // Injetar os 4 slides processados na array reativa
                    slides.value = [
                        { id: 1, content: processSlide(slide1Raw) },
                        { id: 2, content: processSlide(slide2Raw) },
                        { id: 3, content: processSlide(slide3Raw) },
                        { id: 4, content: processSlide(slide4Raw) }
                    ];

                    nextTick(() => {
                        if (typeof feather !== 'undefined') feather.replace();
                    });
                    document.addEventListener('keydown', handleKeydown);
                });

                // --- FUNÇÕES DE NAVEGAÇÃO E ATALHOS ---
                const nextSlide = () => {
                    if (currentSlideIndex.value < slides.value.length - 1) {
                        isLoadingSlide.value = true;
                        currentSlideIndex.value++;
                        setTimeout(() => isLoadingSlide.value = false, 300);
                        updateIcons();
                    }
                };

                const prevSlide = () => {
                    if (currentSlideIndex.value > 0) {
                        isLoadingSlide.value = true;
                        currentSlideIndex.value--;
                        setTimeout(() => isLoadingSlide.value = false, 300);
                        updateIcons();
                    }
                };

                const updateIcons = () => {
                    nextTick(() => {
                        if (typeof feather !== 'undefined') feather.replace();
                    });
                };

                const handleKeydown = (e) => {
                    if(e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
                    if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
                };

                return {
                    slides, 
                    currentSlideIndex, 
                    isLoadingSlide,
                    nextSlide, 
                    prevSlide
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
